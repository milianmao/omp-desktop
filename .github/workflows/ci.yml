# CI — runs the shared test suite (tests.yml) on every push and PR, and on
# manual dispatch.
# No bundle build here — that lives in release.yml.

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml
